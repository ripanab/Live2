<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#121212">
  <title>Live Class</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; background: #121212; color: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    #joinScreen { width: 92%; max-width: 380px; margin: auto; padding: 20px; background: #1e1e1e; border-radius: 12px; text-align: center; }
    #joinScreen h2 { margin-top: 0; }
    #joinScreen input, #joinScreen select { width: 100%; padding: 12px; margin: 7px 0; border-radius: 8px; border: 1px solid #333; background: #2a2a2a; color: #fff; font-size: 15px; }
    #joinScreen button { width: 100%; padding: 12px; margin-top: 10px; background: #2e7d32; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
    #statusMsg { margin-top: 10px; color: #ff8a80; font-size: 13px; word-break: break-word; }

    #classScreen { display: none; flex-direction: column; height: 100%; }
    header { padding: 8px 10px; background: #1e1e1e; display: flex; justify-content: space-between; align-items: center; font-size: 13px; border-bottom: 1px solid #2c2c2c; }
    .hdr-btns { display: flex; gap: 6px; }
    .hdr-btns button { padding: 5px 9px; border-radius: 6px; border: none; color: #fff; font-size: 12px; font-weight: 600; cursor: pointer; }

    #mainArea { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }

    #boardContainer { display: none; flex-direction: column; background: #fff; height: 55%; border-bottom: 2px solid #333; }
    #boardTools { background: #222; padding: 5px 8px; display: flex; gap: 8px; align-items: center; font-size: 12px; }
    #boardTools button { padding: 4px 8px; border: none; border-radius: 4px; background: #444; color: #fff; cursor: pointer; }
    #whiteboard { flex: 1; width: 100%; touch-action: none; cursor: crosshair; display: block; }

    #videos { flex: 1; display: flex; flex-wrap: wrap; justify-content: center; align-content: center; gap: 6px; padding: 6px; overflow-y: auto; }
    .video-box { position: relative; width: 47%; max-width: 340px; aspect-ratio: 4/3; background: #1b1b1b; border-radius: 10px; overflow: hidden; border: 2px solid #333; display: flex; align-items: center; justify-content: center; }
    .video-box.pinned { width: 98%; max-width: 760px; border-color: #4caf50; }
    .video-box.hand-raised { border-color: #ff9800; box-shadow: 0 0 10px #ff9800; }
    video { width: 100%; height: 100%; object-fit: cover; cursor: pointer; }
    .label { position: absolute; bottom: 5px; left: 5px; background: rgba(0,0,0,0.7); padding: 2px 7px; border-radius: 4px; font-size: 11px; pointer-events: none; }
    .hand-badge { position: absolute; top: 5px; left: 5px; background: #ff9800; color: #000; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: bold; display: none; }
    .video-box.hand-raised .hand-badge { display: block; }

    .host-actions { position: absolute; top: 5px; right: 5px; display: flex; gap: 4px; }
    .host-actions button { padding: 3px 6px; font-size: 10px; border: none; border-radius: 4px; background: rgba(211,47,47,0.85); color: #fff; cursor: pointer; }

    #chatBox { display: none; height: 38%; background: #1a1a1a; border-top: 1px solid #333; flex-direction: column; }
    #chatMessages { flex: 1; overflow-y: auto; padding: 8px; font-size: 13px; text-align: left; }
    .msg { margin-bottom: 5px; word-break: break-word; }
    .msg b { color: #64b5f6; }
    .msg b.teacher { color: #81c784; }
    #chatForm { display: flex; padding: 6px; gap: 6px; background: #222; }
    #chatInput { flex: 1; padding: 8px; border-radius: 6px; border: none; background: #333; color: #fff; }

    .controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; padding: 7px; background: #1e1e1e; border-top: 1px solid #2c2c2c; }
    .controls button { padding: 8px 10px; border: none; border-radius: 7px; font-size: 12px; font-weight: 600; cursor: pointer; background: #2c2c2c; color: #fff; }
    .controls button.active { background: #1976d2; }
    .controls button.danger { background: #d32f2f; }
  </style>
</head>
<body>

  <!-- 1. LOGIN SCREEN -->
  <div id="joinScreen">
    <h2>Live Class Room</h2>
    <input type="text" id="userNameInput" placeholder="Your Name (e.g., Rahim Sir)" required>
    <select id="roleInput">
      <option value="student">Join as Student</option>
      <option value="teacher">Join as Teacher (Host)</option>
    </select>
    <input type="text" id="roomInput" placeholder="Room Name (e.g., class10)" required>
    <input type="password" id="passInput" placeholder="Class Passcode (e.g., 1234)" required>
    <button type="button" id="enterBtn">Enter Classroom</button>
    <div id="statusMsg"></div>
  </div>

  <!-- 2. CLASSROOM SCREEN -->
  <div id="classScreen">
    <header>
      <span id="roomTitle">Room</span>
      <div class="hdr-btns">
        <button id="muteAllBtn" onclick="muteAllStudents()" style="background:#e65100; display:none;">Mute All</button>
        <button onclick="copyInvite()" style="background:#2e7d32;">Invite Link</button>
      </div>
    </header>

    <div id="mainArea">
      <div id="boardContainer">
        <div id="boardTools">
          <span>Whiteboard:</span>
          <input type="color" id="penColor" value="#000000">
          <button onclick="setEraser()">Eraser</button>
          <button id="clearBoardBtn" onclick="clearBoard()" style="background:#c62828; display:none;">Clear All</button>
        </div>
        <canvas id="whiteboard"></canvas>
      </div>

      <div id="videos"></div>

      <div id="chatBox">
        <div id="chatMessages"></div>
        <form id="chatForm" onsubmit="sendChat(event)">
          <input type="text" id="chatInput" placeholder="Type message..." autocomplete="off">
          <button type="submit" style="padding:8px 14px; border:none; border-radius:6px; background:#1976d2; color:#fff;">Send</button>
        </form>
      </div>
    </div>

    <div class="controls">
      <button id="micBtn" onclick="toggleMic()">Mic On</button>
      <button id="camBtn" onclick="toggleCam()">Cam On</button>
      <button onclick="flipCamera()">Flip</button>
      <button id="screenBtn" onclick="toggleScreen()">Screen</button>
      <button id="boardBtn" onclick="toggleBoard()">Board</button>
      <button id="handBtn" onclick="toggleHand()">Hand</button>
      <button id="chatBtn" onclick="toggleChat()">Chat</button>
      <button class="danger" onclick="leaveClass()">Leave</button>
    </div>
  </div>

  <script>
    const statusMsg = document.getElementById('statusMsg');

    // Show any unexpected JS errors directly on screen
    window.onerror = function(msg, url, line) {
      statusMsg.textContent = 'Error (Line ' + line + '): ' + msg;
    };

    const params = new URLSearchParams(window.location.search);
    if (params.get('room')) document.getElementById('roomInput').value = params.get('room');
    if (params.get('pass')) document.getElementById('passInput').value = params.get('pass');

    let myName = '', myRole = 'student', roomName = '', passcode = '';
    const myId = 'u-' + Math.random().toString(36).substring(2, 9);
    const peers = {};
    let localStream = null;
    let usingFrontCam = true;
    let isScreenSharing = false;
    let handRaised = false;
    let lastChatCount = 0;
    let renderedStrokeCount = 0;

    const rtcConfig = {
      iceServers: [
        { urls: 'stun:://google.com' },
        { urls: 'stun:://google.com' }
      ]
    };

    document.getElementById('enterBtn').addEventListener('click', startClass);

    async function startClass() {
      myName = document.getElementById('userNameInput').value.trim();
      myRole = document.getElementById('roleInput').value;
      roomName = document.getElementById('roomInput').value.trim();
      passcode = document.getElementById('passInput').value.trim();

      if (!myName || !roomName || !passcode) {
        statusMsg.textContent = 'Please enter your Name, Room Name, and Passcode.';
        return;
      }

      statusMsg.style.color = '#81c784';
      statusMsg.textContent = 'Starting camera and joining room...';

      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        try {
          localStream = await navigator.mediaDevices.getUserMedia({
            video: { width: { ideal: 320 }, height: { ideal: 240 }, facingMode: 'user' },
            audio: true
          });
        } catch (err) {
          try {
            localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
          } catch (err2) {
            localStream = new MediaStream();
          }
        }
      } else {
        localStream = new MediaStream();
      }

      try {
        const res = await fetch('/api/join', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ roomName, passcode, userId: myId, userName: myName, role: myRole })
        });

        if (!res.ok) {
          const errData = await res.json();
          statusMsg.style.color = '#ff8a80';
          statusMsg.textContent = errData.error || 'Could not join room.';
          return;
        }

        const data = await res.json();

        document.getElementById('joinScreen').style.display = 'none';
        document.getElementById('classScreen').style.display = 'flex';
        document.getElementById('roomTitle').textContent = roomName + ' (' + (myRole === 'teacher' ? 'Host' : 'Student') + ')';

        if (myRole === 'teacher') {
          document.getElementById('muteAllBtn').style.display = 'inline-block';
document.getElementById('clearBoardBtn').style.display = 'inline-block';
}
addVideoBox(localStream, myId, myName + ' (You)', myRole, true);
for (const userId in data.users) {
createPeer(userId, data.users[userId].name, data.users[userId].role, true);
}
renderChat(data.chat);
drawStrokesFromServer(data.boardStrokes);
setInterval(pollServer, 1500);
} catch (netErr) {
statusMsg.style.color = '#ff8a80';
statusMsg.textContent = 'Server error: ' + netErr.message;
}
}
async function pollServer() {
try {
const url = '/api/poll?roomName=' + encodeURIComponent(roomName) + '&passcode=' + encodeURIComponent(passcode) + '&userId=' + myId;
const res = await fetch(url);
const data = await res.json();
if (data.kicked) {
alert('You have been removed from the class by the teacher.');
leaveClass();
return;
}
if (data.forceMute && localStream) {
const track = localStream.getAudioTracks().at(0);
if (track && track.enabled) {
track.enabled = false;
const btn = document.getElementById('micBtn');
btn.textContent = 'Mic Muted';
btn.classList.add('danger');
alert('The teacher muted your microphone.');
}
}
for (const msg of data.signals) {
const senderInfo = data.users[msg.sender] || { name: 'Student', role: 'student' };
let peer = peers[msg.sender] || createPeer(msg.sender, senderInfo.name, senderInfo.role, false);
if (msg.signal.sdp) {
await peer.setRemoteDescription(new RTCSessionDescription(msg.signal.sdp));
if (msg.signal.sdp.type === 'offer') {
const answer = await peer.createAnswer();
await peer.setLocalDescription(answer);
sendSignal(msg.sender, { sdp: peer.localDescription });
}
} else if (msg.signal.candidate) {
await peer.addIceCandidate(new RTCIceCandidate(msg.signal.candidate));
}
}
for (const id in data.users) {
if (id !== myId && !document.getElementById('box-' + id)) {
addVideoBox(null, id, data.users[id].name, data.users[id].role, false);
}
const box = document.getElementById('box-' + id);
if (box) {
box.classList.toggle('hand-raised', !!data.users[id].hand);
}
}
for (const peerId in peers) {
if (!data.users[peerId]) {
peers[peerId].close();
delete peers[peerId];
const box = document.getElementById('box-' + peerId);
if (box) box.remove();
}
}
renderChat(data.chat);
drawStrokesFromServer(data.boardStrokes);
} catch (e) {
console.error('Poll error:', e);
}
}
function sendSignal(target, signal) {
fetch('/api/signal', {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({ roomName, passcode, sender: myId, target, signal })
});
}
function createPeer(userId, userName, userRole, initiator) {
const peer = new RTCPeerConnection(rtcConfig);
peers[userId] = peer;
const tracks = localStream ? localStream.getTracks() : [];
if (tracks.length > 0) {
tracks.forEach(track => peer.addTrack(track, localStream));
} else {
peer.addTransceiver('video', { direction: 'recvonly' });
peer.addTransceiver('audio', { direction: 'recvonly' });
}
peer.onicecandidate = e => {
if (e.candidate) sendSignal(userId, { candidate: e.candidate });
};
peer.ontrack = e => {
const remoteStream = (e.streams && e.streams.at(0)) ? e.streams.at(0) : new MediaStream([e.track]);
addVideoBox(remoteStream, userId, userName, userRole, false);
};
if (initiator) {
peer.onnegotiationneeded = async () => {
const offer = await peer.createOffer();
await peer.setLocalDescription(offer);
sendSignal(userId, { sdp: peer.localDescription });
};
}
return peer;
}
function addVideoBox(stream, id, labelText, userRole, isMe) {
let box = document.getElementById('box-' + id);
if (box) {
if (stream) {
const existingVid = box.querySelector('video');
if (existingVid) existingVid.srcObject = stream;
}
return;
}
box = document.createElement('div');
box.className = 'video-box';
box.id = 'box-' + id;
const v = document.createElement('video');
if (stream) v.srcObject = stream;
v.autoplay = true;
v.playsInline = true;
if (isMe) v.muted = true;
v.onclick = () => box.classList.toggle('pinned');
const label = document.createElement('div');
label.className = 'label';
label.textContent = userRole === 'teacher' ? '⭐ ' + labelText : labelText;
const badge = document.createElement('div');
badge.className = 'hand-badge';
badge.textContent = '✋ Hand';
box.append(v, label, badge);
if (myRole === 'teacher' && !isMe) {
const hostDiv = document.createElement('div');
hostDiv.className = 'host-actions';
const muteBtn = document.createElement('button');
muteBtn.textContent = 'Mute';
muteBtn.onclick = () => sendHostAction('muteUser', id);
const kickBtn = document.createElement('button');
kickBtn.textContent = 'Kick';
kickBtn.onclick = () => {
if (confirm('Remove ' + labelText + ' from class?')) sendHostAction('kickUser', id);
};
hostDiv.append(muteBtn, kickBtn);
box.appendChild(hostDiv);
}
document.getElementById('videos').appendChild(box);
}
function sendHostAction(type, targetId) {
fetch('/api/action', {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({ roomName, passcode, userId: myId, type, targetId })
});
}
function muteAllStudents() {
sendHostAction('muteAll', null);
alert('Mute command sent to all students.');
}
function toggleMic() {
const track = localStream ? localStream.getAudioTracks().at(0) : null;
if (!track) return alert('No microphone available.');
track.enabled = !track.enabled;
const btn = document.getElementById('micBtn');
btn.textContent = track.enabled ? 'Mic On' : 'Mic Muted';
btn.classList.toggle('danger', !track.enabled);
}
function toggleCam() {
const track = localStream ? localStream.getVideoTracks().at(0) : null;
if (!track) return alert('No camera available.');
track.enabled = !track.enabled;
const btn = document.getElementById('camBtn');
btn.textContent = track.enabled ? 'Cam On' : 'Cam Off';
btn.classList.toggle('danger', !track.enabled);
}
async function flipCamera() {
if (isScreenSharing) return alert('Stop screen sharing first.');
usingFrontCam = !usingFrontCam;
try {
const newStream = await navigator.mediaDevices.getUserMedia({
video: { width: { ideal: 320 }, height: { ideal: 240 }, facingMode: usingFrontCam ? 'user' : 'environment' }
});
replaceVideoTrack(newStream.getVideoTracks().at(0));
} catch (e) {
alert('Could not switch camera: ' + e.message);
}
}
async function toggleScreen() {
if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
return alert('Screen sharing is only supported on PC/Laptop browsers.');
}
if (!isScreenSharing) {
try {
const screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
const screenTrack = screenStream.getVideoTracks().at(0);
screenTrack.onended = () => stopScreenShare();
replaceVideoTrack(screenTrack);
isScreenSharing = true;
document.getElementById('screenBtn').classList.add('active');
} catch (e) {}
} else {
stopScreenShare();
}
}
async function stopScreenShare() {
const camStream = await navigator.mediaDevices.getUserMedia({
video: { width: { ideal: 320 }, height: { ideal: 240 }, facingMode: usingFrontCam ? 'user' : 'environment' }
});
replaceVideoTrack(camStream.getVideoTracks().at(0));
isScreenSharing = false;
document.getElementById('screenBtn').classList.remove('active');
}
function replaceVideoTrack(newTrack) {
if (!localStream) localStream = new MediaStream();
const oldTrack = localStream.getVideoTracks().at(0);
if (oldTrack) {
localStream.removeTrack(oldTrack);
oldTrack.stop();
}
localStream.addTrack(newTrack);
const myVid = document.querySelector('#box-' + myId + ' video');
if (myVid) myVid.srcObject = localStream;
for (const id in peers) {
const sender = peers[id].getSenders().find(s => s.track && s.track.kind === 'video');
if (sender) sender.replaceTrack(newTrack);
}
}
function toggleHand() {
handRaised = !handRaised;
document.getElementById('handBtn').classList.toggle('active', handRaised);
fetch('/api/action', {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({ roomName, passcode, userId: myId, type: 'hand', hand: handRaised })
});
}
function toggleChat() {
const box = document.getElementById('chatBox');
const isOpen = box.style.display === 'flex';
box.style.display = isOpen ? 'none' : 'flex';
document.getElementById('chatBtn').classList.toggle('active', !isOpen);
}
function sendChat(e) {
e.preventDefault();
const input = document.getElementById('chatInput');
const text = input.value.trim();
if (!text) return;
input.value = '';
fetch('/api/action', {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({ roomName, passcode, userId: myId, userName: myName, type: 'chat', text })
});
}
function renderChat(messages) {
if (!messages || messages.length === lastChatCount) return;
lastChatCount = messages.length;
const container = document.getElementById('chatMessages');
container.innerHTML = messages.map(m =>
'' + m.sender + ': ' + m.text + ''
).join('');
container.scrollTop = container.scrollHeight;
}
// --- SHARED WHITEBOARD ---
const canvas = document.getElementById('whiteboard');
const ctx = canvas.getContext('2d');
let drawing = false;
let prevX = 0, prevY = 0;
function toggleBoard() {
const container = document.getElementById('boardContainer');
const isOpen = container.style.display === 'flex';
container.style.display = isOpen ? 'none' : 'flex';
document.getElementById('boardBtn').classList.toggle('active', !isOpen);
if (!isOpen) resizeCanvas();
}
function resizeCanvas() {
canvas.width = canvas.offsetWidth;
canvas.height = canvas.offsetHeight;
renderedStrokeCount = 0;
}
function setEraser() {
document.getElementById('penColor').value = '#ffffff';
}
function clearBoard() {
ctx.clearRect(0, 0, canvas.width, canvas.height);
renderedStrokeCount = 0;
sendHostAction('clearBoard', null);
}
function getPos(e) {
const rect = canvas.getBoundingClientRect();
const touch = e.touches ? Array.from(e.touches).at(0) : null;
const clientX = touch ? touch.clientX : e.clientX;
const clientY = touch ? touch.clientY : e.clientY;
return {
x: (clientX - rect.left) / canvas.width,
y: (clientY - rect.top) / canvas.height
};
}
function startDraw(e) {
drawing = true;
const pos = getPos(e);
prevX = pos.x;
prevY = pos.y;
}
function moveDraw(e) {
if (!drawing) return;
e.preventDefault();
const pos = getPos(e);
const color = document.getElementById('penColor').value;
const size = color === '#ffffff' ? 16 : 3;
const stroke = { x0: prevX, y0: prevY, x1: pos.x, y1: pos.y, color, size };
drawLine(stroke);
prevX = pos.x;
prevY = pos.y;
fetch('/api/action', {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({ roomName, passcode, userId: myId, type: 'draw', stroke })
});
}
function endDraw() {
drawing = false;
}
canvas.addEventListener('mousedown', startDraw);
canvas.addEventListener('mousemove', moveDraw);
window.addEventListener('mouseup', endDraw);
canvas.addEventListener('touchstart', startDraw, { passive: false });
canvas.addEventListener('touchmove', moveDraw, { passive: false });
canvas.addEventListener('touchend', endDraw);
function drawLine(s) {
ctx.beginPath();
ctx.moveTo(s.x0 * canvas.width, s.y0 * canvas.height);
ctx.lineTo(s.x1 * canvas.width, s.y1 * canvas.height);
ctx.strokeStyle = s.color;
ctx.lineWidth = s.size;
ctx.lineCap = 'round';
ctx.stroke();
}
function drawStrokesFromServer(strokes) {
if (!strokes) return;
if (strokes.length === 0 && renderedStrokeCount > 0) {
ctx.clearRect(0, 0, canvas.width, canvas.height);
renderedStrokeCount = 0;
return;
}
if (strokes.length <= renderedStrokeCount) return;
for (let i = renderedStrokeCount; i < strokes.length; i++) {
drawLine(strokes[i]);
}
renderedStrokeCount = strokes.length;
}
function copyInvite() {
const url = window.location.origin + '?room=' + encodeURIComponent(roomName) + '&pass=' + encodeURIComponent(passcode);
if (navigator.clipboard) {
navigator.clipboard.writeText(url);
alert('Invite link copied! Share it with your students:\n' + url);
} else {
prompt('Copy this invite link:', url);
}
}
function leaveClass() {
window.location.href = window.location.pathname;
}
</script>
</body>
</html>
